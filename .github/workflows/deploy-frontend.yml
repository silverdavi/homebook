name: Deploy Frontend

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          # Forward server-only secrets into the SSH session so the script
          # can write them into the Next.js .env.local on every deploy.
          # Empty values are silently skipped — adding a secret in the
          # GitHub repo settings is enough; nothing else needs to change.
          envs: OPENAI_API_KEY,RESEND_API_KEY,GEMINI_API_KEY
          script: |
            set -e
            echo "🚀 Deploying frontend..."
            
            cd ~/homebook
            git fetch origin
            git reset --hard origin/main
            
            cd apps/web

            # ── Seed server-side env from GitHub secrets ────────────────
            # Next.js auto-loads apps/web/.env.local at start. We rewrite
            # it on every deploy so secret rotation just works.
            ENV_FILE=.env.local
            : > "$ENV_FILE.tmp"
            if [ -n "${OPENAI_API_KEY:-}" ]; then
              echo "OPENAI_API_KEY=${OPENAI_API_KEY}" >> "$ENV_FILE.tmp"
              echo "  · seeded OPENAI_API_KEY"
            fi
            if [ -n "${RESEND_API_KEY:-}" ]; then
              echo "RESEND_API_KEY=${RESEND_API_KEY}" >> "$ENV_FILE.tmp"
              echo "  · seeded RESEND_API_KEY"
            fi
            if [ -n "${GEMINI_API_KEY:-}" ]; then
              echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> "$ENV_FILE.tmp"
              echo "  · seeded GEMINI_API_KEY"
            fi
            mv "$ENV_FILE.tmp" "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            rm -rf .next/lock
            npm ci --silent
            npm run build
            
            sudo systemctl restart homebook-web
            sleep 5
            
            curl -sf http://localhost:3000 > /dev/null && echo "✅ Frontend deployed!" || exit 1

# Required secrets:
#   EC2_HOST, EC2_SSH_KEY        — connection
#   OPENAI_API_KEY               — daily summary narrative (gpt-4o-mini)
#   RESEND_API_KEY               — daily summary + bug-report email
#   GEMINI_API_KEY  (optional)   — fallback LLM, not used yet
