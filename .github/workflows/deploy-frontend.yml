name: Deploy Frontend

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-frontend.yml'
  # Manual trigger for env-only rotations (e.g. rotating OPENAI_API_KEY)
  # without touching app code.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        # appleboy/ssh-action only forwards env vars that are *also*
        # present on the runner; `envs:` only names which to forward.
        # The block below maps the GitHub secrets onto the runner so the
        # SSH session can see them.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          envs: OPENAI_API_KEY,RESEND_API_KEY,GEMINI_API_KEY
          script: |
            set -e
            echo "🚀 Deploying frontend..."
            
            cd ~/homebook
            git fetch origin
            git reset --hard origin/main
            
            # ── Seed server-side env from GitHub secrets ────────────────
            # apps/web/lib/daily/env.ts reads process.env first and falls
            # back to <repo-root>/.env and <repo-root>/resend.txt. We
            # rewrite both files (preserving any unrelated keys in .env)
            # on every deploy so secret rotation Just Works without SSH.
            #
            # In addition, we mirror them into apps/web/.env.local so
            # `next build` and `next start` load them via Next.js' own
            # env machinery.
            seed_kv() {
              local file="$1" key="$2" value="$3"
              [ -z "$value" ] && return 0
              touch "$file"
              chmod 600 "$file"
              # Drop any prior value of $key, then append the new one.
              local tmp; tmp=$(mktemp)
              grep -v "^${key}=" "$file" > "$tmp" || true
              echo "${key}=${value}" >> "$tmp"
              mv "$tmp" "$file"
              chmod 600 "$file"
              echo "  · seeded $key into $file"
            }

            cd ~/homebook
            seed_kv ".env"       "OPENAI_API_KEY" "${OPENAI_API_KEY:-}"
            seed_kv ".env"       "RESEND_API_KEY" "${RESEND_API_KEY:-}"
            seed_kv ".env"       "GEMINI_API_KEY" "${GEMINI_API_KEY:-}"
            seed_kv "resend.txt" "RESEND_API_KEY" "${RESEND_API_KEY:-}"

            cd apps/web
            : > .env.local
            chmod 600 .env.local
            seed_kv ".env.local" "OPENAI_API_KEY" "${OPENAI_API_KEY:-}"
            seed_kv ".env.local" "RESEND_API_KEY" "${RESEND_API_KEY:-}"
            seed_kv ".env.local" "GEMINI_API_KEY" "${GEMINI_API_KEY:-}"

            rm -rf .next/lock
            npm ci --silent
            npm run build
            
            sudo systemctl restart homebook-web
            sleep 5
            
            curl -sf http://localhost:3000 > /dev/null && echo "✅ Frontend deployed!" || exit 1

# Required secrets:
#   EC2_HOST, EC2_SSH_KEY        — connection
#   OPENAI_API_KEY               — daily summary narrative (gpt-4o-mini)
#   RESEND_API_KEY               — daily summary + bug-report email
#   GEMINI_API_KEY  (optional)   — fallback LLM, not used yet
